<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riva — Feed v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #C9C6BC; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  .stage { width: 100vw; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px 0 40px; }
  .legend { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #6B675C; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#100F0C"/>
    <text x="50" y="50" font-family="Archivo, Arial Black, sans-serif" font-weight="900" font-size="24" fill="#F4F1E8" text-anchor="middle" letter-spacing="-1">RIVA</text>
    <rect x="67" y="38" width="7" height="7" fill="#FF5A1F"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="image-slot.js"></script>
<script src="riva-v2-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="riva-v2-icons.jsx"></script>
<script type="text/babel" src="riva-v2-navs.jsx"></script>
<script type="text/babel" src="riva-v2-cards.jsx"></script>
<script type="text/babel" src="riva-v2-app.jsx"></script>

<script type="text/babel">
const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakRadio, TweakSelect } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "Ink",
  "accent": "#FFC400",
  "nav": "Loadout"
}/*EDITMODE-END*/;

const NAV_STYLES = window.RIVA_NAV_STYLES || ["Classic", "Dial", "Loadout", "Rail"];

const ACCENTS = [
  "#FF5A1F", // volt orange
  "#FF3B30", // crimson
  "#FF2E63", // magenta
  "#FF4DA6", // hot pink
  "#8B5CF6", // violet
  "#4F5DFF", // indigo
  "#2F6BFF", // cobalt
  "#19C9C0", // teal
  "#2EE6A6", // mint
  "#A8FF00", // acid
  "#C2F73D", // chartreuse
  "#FFC400", // gold
];

// pick legible text color on the accent
function onAccent(hex) {
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return lum > 0.6 ? "#15140F" : "#FFFFFF";
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const themeKey = t.theme === "Paper" ? "paper" : "ink";
  const T = window.v2theme(themeKey, t.accent, onAccent(t.accent));

  return (
    <div className="stage">
      <window.IOSDevice dark={themeKey === "ink"} width={402} height={862}>
        <window.RivaFeed T={T} nav={t.nav} />
      </window.IOSDevice>
      <div className="legend">
        <span><i style={{ background: "#E0497B" }}></i>Photo</span>
        <span><i style={{ background: t.accent }}></i>PR moment</span>
        <span><i style={{ background: "#7C5CF6" }}></i>Session</span>
        <span><i style={{ background: "#15B886" }}></i>Video</span>
        <span><i style={{ background: "#3B82F6" }}></i>Milestone</span>
      </div>

      <TweaksPanel>
        <TweakSection label="Navigation" />
        <TweakSelect label="Nav style" value={t.nav} options={NAV_STYLES} onChange={(v) => setTweak("nav", v)} />
        <TweakSection label="Theme" />
        <TweakRadio label="Surface" value={t.theme} options={["Ink", "Paper"]} onChange={(v) => setTweak("theme", v)} />
        <TweakColor label="Accent" value={t.accent} options={ACCENTS} onChange={(v) => setTweak("accent", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
